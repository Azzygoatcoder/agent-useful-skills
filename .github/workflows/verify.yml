name: verify

# 本仓库的门禁此前全靠手工跑；已经证明它们能抓真问题
# （校验器抓过版本失配与配图漂移），所以固化成 CI。
# 全部检查都是离线的：不调用任何 LLM/MCP 端点，不需要密钥。
#
# 同时以 workflow_call 暴露给 release.yml 复用 —— 发版前必须过同一套门禁。
# 之所以复用而不是在 release.yml 里抄一份检查清单：抄一份的话，
# 这里以后加了新门禁，发版那条路会**静默不跑**它。

"on":
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Windows runner 上 Python 的 stdout 默认是 cp1252，而本仓库的脚本会输出
# 中文与 ✅/✗ 等字符 —— 不设这个就会 UnicodeEncodeError。
# 脚本自身也做了 reconfigure 兜底，这里是 CI 侧的双保险。
env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.9 = pyproject 声明的 requires-python 下限；3.11 = 本机开发版本。
        # 声明了下限就该被真实检验，否则那个声明没有意义。
        python: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 语法检查（按 matrix 的 Python 版本编译全部脚本）
        shell: bash
        run: python -m compileall -q bin tests

      - name: 技能校验器（DSH frontmatter 契约 / 清单 / 交叉引用 / 配图漂移）
        shell: bash
        run: python bin/check_skills.py --strict

      - name: bin 契约离线自测（review 截断 / 审计状态往返 / validate 契约）
        shell: bash
        run: python tests/test_bin_contracts.py

      - name: 审计报告注解契约（VERDICT/SEVERITY 互斥 / FILE 存在 / fixed 的 COMMIT 是祖先）
        shell: bash
        run: |
          # SECURITY_AUDIT.md 按设计被插件 .gitignore 排除（报告只留本地），
          # 所以 CI 上通常没有报告可校验 —— 有则校验，没有则明确跳过，而不是假装通过。
          report="plugins/code-security-skills/docs/SECURITY_AUDIT.md"
          if [ -f "$report" ]; then
            python bin/security_audit_tools.py validate --report "$report"
          else
            echo "跳过：$report 不在仓库中（.gitignore 有意排除审计报告）"
          fi

      - name: 解析插件依赖（verify-plugin 需要 dsh-skill-filesystem）
        shell: bash
        run: npm install --no-audit --no-fund

      - name: 插件白盒自检（注册契约 / 去重 / 候选形状）
        shell: bash
        run: node bin/verify-plugin.mjs

      - name: 配图派生一致性（HTML 图源 → SVG 是否同步）
        shell: bash
        run: |
          python bin/export_diagram.py --check \
            plugins/code-security-skills/assets/audit-workflow.html \
            plugins/code-security-skills/assets/verdict-model.html \
            plugins/dev-workflow/assets/push-access-flowchart.html

      - name: 外部依赖清单自检（验证清单可解析 + 逻辑可跑；不要求依赖存在）
        shell: bash
        run: python bin/check_external.py

      - name: 部署/自愈校验
        shell: pwsh
        run: |
          # CI 是全新环境，先造一个含 junction/symlink 的 DSH_HOME，
          # 再让 -Check 校验它——这样也顺带验证了部署逻辑本身
          $dshHome = Join-Path $env:RUNNER_TEMP "dsh-home"
          python tests/make_dsh_home.py $dshHome
          $env:DSH_HOME = $dshHome
          pwsh -NoProfile -File bin/redeploy-skills.ps1 -Check
