[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-useful-skills"
version = "1.5.2"
description = "模块化 AI 科研/工程技能 monorepo（Claude Code / DeepSeek Harness 通用）"
requires-python = ">=3.9"
# 授权策略见 LICENSING.md（根 MIT 覆盖全仓库；plugins/* 各自另带一份）
# 用 PEP 639 的 SPDX 字符串 + license-files，而不是被弃用的 `{ text = ... }` 表：
# 后者在 setuptools>=77 上每次构建都告警「deprecation is overdue … may become build errors」，
# 而发版恰恰依赖这条构建链。setuptools 77 的 Requires-Python 仍是 >=3.9，故下限同步上移。
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
# 核心命令（review / vision / check-skills / latex-build 等）零第三方依赖；
# 可选能力按用途分组，避免为用一个命令装齐全部重依赖。
office = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
]
plot = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "numpy>=1.24",
]
all = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
review = "review:main"
vision = "vision:main"
consistency-check = "consistency_check:main"
fig2drawio = "fig2drawio:main"
office-tools = "office_tools:main"
latex-build = "latex_build:main"
security-audit-tools = "security_audit_tools:main"
data-plot = "data_plot:main"
style-reference-docx = "style_reference_docx:main"
check-skills = "check_skills:main"
export-diagram = "export_diagram:main"
check-external = "check_external:main"

[tool.setuptools]
package-dir = {"" = "bin"}
py-modules = [
    "llm",
    "vision",
    "review",
    "consistency_check",
    "fig2drawio",
    "data_plot",
    "office_tools",
    "latex_build",
    "security_audit_tools",
    "style_reference_docx",
    "check_skills",
    "export_diagram",
    "check_external",
]
