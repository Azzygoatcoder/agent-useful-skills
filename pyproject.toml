[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-useful-skills"
version = "1.2.1"
description = "模块化 AI 科研/工程技能 monorepo（Claude Code / DeepSeek Harness 通用）"
requires-python = ">=3.9"

[project.optional-dependencies]
# 核心命令（review / vision / check-skills / latex-build 等）零第三方依赖；
# 可选能力按用途分组，避免为用一个命令装齐全部重依赖。
office = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
]
plot = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "numpy>=1.24",
]
all = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
review = "review:main"
vision = "vision:main"
consistency-check = "consistency_check:main"
fig2drawio = "fig2drawio:main"
office-tools = "office_tools:main"
latex-build = "latex_build:main"
security-audit-tools = "security_audit_tools:main"
data-plot = "data_plot:main"
style-reference-docx = "style_reference_docx:main"
check-skills = "check_skills:main"

[tool.setuptools]
package-dir = {"" = "bin"}
py-modules = [
    "llm",
    "vision",
    "review",
    "consistency_check",
    "fig2drawio",
    "data_plot",
    "office_tools",
    "latex_build",
    "security_audit_tools",
    "style_reference_docx",
    "check_skills",
]
