<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计 skill v1.4 工作流</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Microsoft YaHei', serif;
      --font-mono:     'Geist Mono', 'Microsoft YaHei', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Audit Skill v1.4</p>
    <h1>code-security-audit — v1.4 工作流</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── Arrows (behind nodes) ── -->
      <!-- 场景判定 → Pre-Flight (coral, happy path) -->
      <line x1="500" y1="96" x2="500" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 场景判定 → 非默认 routes (right) -->
      <line x1="620" y1="64" x2="700" y2="64" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Pre-Flight → Phase 1 -->
      <line x1="500" y1="176" x2="500" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phase 1 → Phase 2 -->
      <line x1="500" y1="248" x2="500" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phase 2 → review.py gate -->
      <line x1="500" y1="320" x2="500" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- review.py → Phase 3 -->
      <line x1="500" y1="400" x2="500" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phase 3 → Phase 4 -->
      <line x1="500" y1="472" x2="500" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phase 4 → tools (coral, happy path) -->
      <line x1="500" y1="544" x2="500" y2="568" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ── Arrow labels ── -->
      <rect x="456" y="104" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="500" y="115" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">全面审计 · 默认</text>

      <rect x="640" y="54" width="48" height="14" rx="2" fill="#f5f5f5"/>
      <text x="664" y="65" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">非默认</text>

      <!-- ── 场景判定 diamond ── -->
      <polygon points="500,32 620,64 500,96 380,64" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">场景判定</text>
      <text x="500" y="75" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scene triage</text>

      <!-- 非默认 routes note -->
      <rect x="700" y="44" width="248" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="824" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">快速 L1 · 增量重审 · 单PR</text>
      <text x="824" y="74" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ code-review / security-fix</text>

      <!-- ── Pre-Flight ── -->
      <rect x="400" y="128" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pre-Flight 门禁</text>
      <text x="500" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">patterns · commit · probe</text>

      <!-- ── Phase 1 ── -->
      <rect x="400" y="200" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phase 1 并行探索</text>
      <text x="500" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 agents → 单agent 兜底</text>

      <!-- ── Phase 2 ── -->
      <rect x="400" y="272" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phase 2 深度验证</text>
      <text x="500" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Self-Check 5点 · 去重</text>

      <!-- ── review.py 对抗闸门 (coral focal) ── -->
      <rect x="400" y="344" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">review.py 对抗闸门</text>
      <text x="500" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ARIS · 跨模型强攻 findings</text>

      <!-- ── Phase 3 ── -->
      <rect x="400" y="424" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phase 3 报告</text>
      <text x="500" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SECURITY_AUDIT.md + 注解</text>

      <!-- ── Phase 4 ── -->
      <rect x="400" y="496" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phase 4 增量重审</text>
      <text x="500" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git diff 变更文件</text>

      <!-- ── security-audit-tools.py end oval (coral focal) ── -->
      <rect x="380" y="568" width="240" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="594" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">security-audit-tools.py</text>
      <text x="500" y="610" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">list · status · diff-filter · mark-*</text>

      <!-- ── Legend ── -->
      <line x1="40" y1="644" x2="960" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="676" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

      <polygon points="244,682 256,676 268,682 256,688" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

      <rect x="432" y="676" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="464" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">v1.4 新增 (coral)</text>

      <line x1="604" y1="684" x2="632" y2="684" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="640" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>
    </svg>
  </div>
</body>
</html>
