<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="audit-workflow-title audit-workflow-desc">
    <title id="audit-workflow-title">安全审计 skill 四阶段工作流</title>
    <desc id="audit-workflow-desc">安全审计技能的工作流图：场景判定后默认进入 Pre-Flight 门禁，再依次走 Phase 1 并行探索（四路 agent）、Phase 2 深度验证（判别表 → 回读去重 → Self-Check → 独立性复核 → 定级判定）、review.py 跨模型对抗叠加层、Phase 3 报告（含 Coverage 与 Needs Validation 段）与 Phase 4 增量重审（以祖先检查开头），末端由 security-audit-tools 提供含 validate 的命令集（共八条契约检查：先做标题与注解的对账，再逐条校验其余七条）；要求快扫时旁路降级为 L1。</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ arrows first (z-order behind boxes) ============ -->

    <!-- decision -> Pre-Flight (down, coral = default path) -->
    <line x1="500" y1="240" x2="500" y2="272" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <!-- decision -> off-ramp (right) -->
    <line x1="620" y1="160" x2="700" y2="160" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Pre-Flight -> Phase 1 -->
    <line x1="500" y1="360" x2="500" y2="392" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 1 -> Phase 2 -->
    <line x1="500" y1="520" x2="500" y2="552" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 2 -> review.py overlay -->
    <line x1="500" y1="700" x2="500" y2="732" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- review.py -> Phase 3 -->
    <line x1="500" y1="820" x2="500" y2="852" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 3 -> Phase 4 -->
    <line x1="500" y1="960" x2="500" y2="992" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 4 -> tools -->
    <line x1="500" y1="1120" x2="500" y2="1152" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ============ arrow labels (masked, 8px gap above the stroke) ============ -->

    <rect x="508" y="248" width="104" height="16" rx="2" fill="#f5f5f5"/>
    <text x="560" y="261" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">全面审计 · 默认</text>

    <rect x="636" y="136" width="32" height="16" rx="2" fill="#f5f5f5"/>
    <text x="652" y="149" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">快扫</text>

    <rect x="508" y="712" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="556" y="721" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle" letter-spacing="0.06em">FINDING·SOURCE</text>

    <!-- ============ off-ramp box ============ -->
    <rect x="700" y="116" width="260" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="830" y="148" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">降级：不进入四阶段</text>
    <text x="830" y="168" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">L1 快速扫描 · 增量重审 · 单 PR</text>
    <text x="830" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">single-PR → dev-workflow</text>

    <!-- ============ main flow boxes ============ -->

    <!-- decision -->
    <polygon points="500,80 620,160 500,240 380,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="156" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">场景判定</text>
    <text x="500" y="176" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">先定深度</text>

    <!-- Pre-Flight -->
    <rect x="380" y="272" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="304" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Pre-Flight 门禁</text>
    <text x="500" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">patterns · commit · probe</text>
    <text x="500" y="344" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">无条件，快扫也不跳</text>

    <!-- Phase 1 -->
    <rect x="320" y="392" width="360" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="424" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 1 并行探索</text>
    <text x="500" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">secrets · injection · auth-crypto-deps</text>
    <text x="500" y="464" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">A 密钥 · B 注入 · C 认证-加密-依赖</text>
    <text x="500" y="484" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">D 业务逻辑 · 功能滥用 · 链式信任边界 · Wildcard</text>
    <text x="500" y="504" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">L2/L3 · 与前三路互不依赖 · 单 agent 兜底</text>

    <!-- Phase 2 -->
    <rect x="300" y="552" width="400" height="148" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="584" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 2 深度验证</text>
    <text x="500" y="604" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">① 过「不算 Finding」判别表 17 行 + 4 全局规则</text>
    <text x="500" y="624" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">② 回读被标记源码 + 去重</text>
    <text x="500" y="644" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">③ Self-Check 5 点</text>
    <text x="500" y="664" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">④ 独立性复核：发现者不得复核自己</text>
    <text x="500" y="684" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">⑤ 定严重度 + 稳定前缀 ID + 判定 VERDICT</text>

    <!-- review.py overlay -->
    <rect x="340" y="732" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="764" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">review.py 跨模型对抗</text>
    <text x="500" y="784" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">叠加手段 · 非必过闸门</text>
    <text x="500" y="804" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">独立性复核才是主闸门</text>

    <!-- Phase 3 -->
    <rect x="320" y="852" width="360" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="884" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 3 报告</text>
    <text x="500" y="904" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">SECURITY_AUDIT.md + &lt;!--AUDIT:…--&gt;</text>
    <text x="500" y="924" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">## Coverage 非空：审了什么 · 未审及原因</text>
    <text x="500" y="944" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">新增 ## Needs Validation 段</text>

    <!-- Phase 4 -->
    <rect x="320" y="992" width="360" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="1024" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 4 增量重审</text>
    <text x="500" y="1044" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">git merge-base --is-ancestor &lt;commit&gt; HEAD</text>
    <text x="500" y="1064" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">通过 → diff-filter 增量；跳过项须披露</text>
    <text x="500" y="1084" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">失败 → 全量重验 + 重新基线</text>
    <text x="500" y="1104" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">跳过的 finding 标「未重验」</text>

    <!-- end (focal) -->
    <rect x="280" y="1152" width="440" height="108" rx="10" fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36" stroke-width="2"/>
    <text x="500" y="1184" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">security-audit-tools</text>
    <text x="500" y="1204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">list · status · diff-filter · mark-* · validate</text>
    <text x="500" y="1224" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">validate：8 条契约检查 · 标题↔注解对账先行 · 已接入 CI</text>
    <text x="500" y="1244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">RECONCILE·ID·VERDICT-SEVERITY·BLOCKER·FILE·LINES·COMMIT·Coverage</text>

    <!-- ============ legend ============ -->
    <line x1="40" y1="1300" x2="960" y2="1300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="1324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          letter-spacing="0.14em">LEGEND</text>
    <text x="92" y="1324" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif">形状承载类型</text>

    <!-- step -->
    <rect x="40" y="1340" width="44" height="20" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="92" y="1354" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif">步骤</text>

    <!-- decision diamond -->
    <polygon points="382,1338 404,1350 382,1362 360,1350" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="412" y="1354" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif">判定</text>

    <!-- off-ramp -->
    <rect x="680" y="1340" width="44" height="20" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="732" y="1354" fill="#4f5d75" font-size="12" font-weight="500"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif">旁路</text>
  </svg>
