<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全审计 skill 工作流</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:   #f5f5f5;
    --color-ink:     #2d3142;
    --color-muted:   #4f5d75;
    --color-soft:    #7a8399;
    --color-accent:  #eb6c36;
    --color-accent-tint: rgba(235,108,54,0.08);
    --font-sans:  'Geist', 'Microsoft YaHei', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Microsoft YaHei', serif;
    --font-mono:  'Geist Mono', 'Microsoft YaHei', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    padding: 2rem 1rem;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--color-soft); margin-bottom: 0.5rem;
  }
  h1 { font-family: var(--font-serif); font-weight: 400; font-size: 1.75rem; margin-bottom: 0.25rem; }
  .sub { color: var(--color-muted); font-size: 13px; margin-bottom: 1.5rem; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Code Security Skills · 工作流</p>
  <h1>安全审计：四阶段与两种入口</h1>
  <p class="sub">默认走全面审计（Phase 1-3 外加跨模型对抗闸门）；只有要求"快扫"才降级 L1。</p>

  <svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="安全审计工作流：场景判定分流到全面审计四阶段，或降级为快速扫描">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ arrows first (z-order behind boxes) ============ -->

    <!-- decision -> Pre-Flight (down, coral = default/happy path) -->
    <path d="M 500 208 L 500 256" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <rect x="450" y="216" width="100" height="12" rx="2" fill="#f5f5f5"/>
    <text x="500" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle" letter-spacing="0.06em">全面审计·默认</text>

    <!-- decision -> off-ramp (right) -->
    <path d="M 605 160 L 700 160" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="628" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="652" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle" letter-spacing="0.06em">快扫</text>

    <!-- Pre-Flight -> Phase 1 -->
    <path d="M 500 384 L 500 412" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 1 -> Phase 2 -->
    <path d="M 500 540 L 500 568" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 2 -> review gate -->
    <path d="M 500 696 L 500 724" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- review gate -> Phase 3 -->
    <path d="M 500 852 L 500 880" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 3 -> Phase 4 -->
    <path d="M 500 984 L 500 1012" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Phase 4 -> end (coral = happy path) -->
    <path d="M 500 1140 L 500 1168" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <!-- ============ off-ramp box ============ -->
    <rect x="700" y="112" width="280" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="840" y="146" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">降级：不进入四阶段</text>
    <text x="840" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">L1 快速扫描 · 增量重审 · 单 PR</text>
    <text x="840" y="182" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">单 PR → dev-workflow</text>

    <!-- ============ main flow boxes ============ -->

    <!-- decision -->
    <polygon points="500,88 605,160 500,232 395,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="156" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">场景判定</text>
    <text x="500" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">先定深度</text>

    <!-- Pre-Flight -->
    <rect x="380" y="256" width="240" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="312" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Pre-Flight 门禁</text>
    <text x="500" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">patterns · commit · probe</text>
    <text x="500" y="346" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">无条件，快扫也不跳</text>

    <!-- Phase 1 -->
    <rect x="380" y="412" width="240" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="468" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 1 并行探索</text>
    <text x="500" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">3 个域 agent · 单 agent 兜底</text>

    <!-- Phase 2 -->
    <rect x="380" y="568" width="240" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="624" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 2 深度验证</text>
    <text x="500" y="642" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">Self-Check 5 点 · 去重 · 定级</text>

    <!-- review gate -->
    <rect x="380" y="724" width="240" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="780" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">review.py 对抗闸门</text>
    <text x="500" y="798" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">独立模型攻击 findings</text>

    <!-- Phase 3 -->
    <rect x="380" y="880" width="240" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="924" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 3 报告</text>
    <text x="500" y="942" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">SECURITY_AUDIT.md + 注解</text>

    <!-- Phase 4 -->
    <rect x="380" y="1012" width="240" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="1068" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Phase 4 增量重审</text>
    <text x="500" y="1086" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">git diff 变更文件 · 状态追踪</text>

    <!-- end (focal) -->
    <rect x="360" y="1168" width="280" height="96" rx="10" fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36" stroke-width="2"/>
    <text x="500" y="1204" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">security-audit-tools</text>
    <text x="500" y="1222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          text-anchor="middle">list · status · diff-filter · mark-*</text>

    <!-- ============ legend ============ -->
    <line x1="40" y1="1300" x2="960" y2="1300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="1324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace"
          letter-spacing="0.14em">LEGEND · 形状承载类型</text>

    <!-- oval -->
    <rect x="40" y="1340" width="44" height="20" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="92" y="1354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">起止</text>

    <!-- rectangle -->
    <rect x="260" y="1340" width="44" height="20" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="312" y="1354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">步骤</text>

    <!-- diamond -->
    <polygon points="500,1340 522,1350 500,1360 478,1350" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="530" y="1354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">判定</text>

    <!-- coral -->
    <rect x="700" y="1340" width="44" height="20" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="752" y="1354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">终点/默认路径</text>
  </svg>
</div>
</body>
</html>
