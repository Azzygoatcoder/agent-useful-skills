<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Workflow — push 权限判定</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 2rem; background: #f5f5f5; font-family: 'Geist', sans-serif; color: #2d3142; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: #7a8399; margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 0.25rem; }
  .sub { color: #4f5d75; font-size: 13px; margin: 0 0 1.5rem; }
  svg { width: 100%; height: auto; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Dev Workflow · 共用判据</p>
  <h1>你有 push 权限吗？</h1>
  <p class="sub">`git remote -v` 看 origin 是权威仓库还是你的 fork —— 决定 release 走 A 直推还是 B fork-PR。</p>

  <svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="push 权限判定流程图">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>
    <rect width="640" height="360" fill="#f5f5f5"/>

    <!-- arrows (before boxes) -->
    <line x1="320" y1="72" x2="320" y2="100" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="416" y1="148" x2="448" y2="148" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="320" y1="196" x2="320" y2="252" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- arrow labels (mask + 8px gap) -->
    <rect x="424" y="128" width="16" height="12" fill="#f5f5f5"/>
    <text x="432" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">有</text>
    <rect x="328" y="220" width="16" height="12" fill="#f5f5f5"/>
    <text x="336" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">无</text>

    <!-- start oval -->
    <rect x="240" y="24" width="160" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="320" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">发版本 / 提 PR</text>

    <!-- decision diamond -->
    <polygon points="320,100 416,148 320,196 224,148" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="320" y="151" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">有 push 权限？</text>

    <!-- Yes → focal (accent) -->
    <rect x="448" y="120" width="168" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="532" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Owner / Maintainer</text>
    <text x="532" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">release A · 不需 PR</text>

    <!-- No → backend -->
    <rect x="240" y="252" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="320" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contributor</text>
    <text x="320" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">release B · 必须 PR</text>
  </svg>
</div>
</body>
</html>
