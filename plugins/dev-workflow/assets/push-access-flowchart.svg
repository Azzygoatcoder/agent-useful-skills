<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="push 权限判定：有权限直推，无权限走 fork-PR">
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>
    <rect width="680" height="380" fill="#f5f5f5"/>

    <!-- ===== arrows first (z-order behind boxes) ===== -->
    <!-- start -> decision -->
    <line x1="340" y1="88" x2="340" y2="112" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- No -> Contributor -->
    <line x1="340" y1="224" x2="340" y2="248" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Yes -> Owner/Maintainer (coral = happy path) -->
    <line x1="452" y1="168" x2="488" y2="168" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== arrow labels (mask + visible 6-10px gap above the stroke) ===== -->
    <rect x="348" y="236" width="16" height="12" rx="2" fill="#f5f5f5"/>
    <text x="356" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">无</text>

    <rect x="452" y="144" width="16" height="12" rx="2" fill="#f5f5f5"/>
    <text x="460" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">有</text>

    <!-- ===== start oval ===== -->
    <rect x="260" y="40" width="160" height="48" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="70" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">发版本 / 提 PR</text>

    <!-- ===== decision diamond ===== -->
    <polygon points="340,112 452,168 340,224 228,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="164" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">有 push 权限？</text>
    <text x="340" y="180" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">.permissions.push</text>

    <!-- ===== terminal: Owner / Maintainer (focal) ===== -->
    <rect x="488" y="136" width="168" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="572" y="162" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Owner / Maintainer</text>
    <text x="572" y="180" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">release A · 不需 PR</text>

    <!-- ===== terminal: Contributor ===== -->
    <rect x="260" y="248" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="274" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', 'Microsoft YaHei', system-ui, sans-serif" text-anchor="middle">Contributor</text>
    <text x="340" y="292" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">release B · 必须 PR</text>

    <!-- ===== legend (horizontal bottom strip) ===== -->
    <line x1="40" y1="336" x2="640" y2="336" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="356" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.14em">LEGEND · 形状承载类型</text>

    <rect x="260" y="344" width="40" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="308" y="356" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace">起止</text>

    <polygon points="392,344 412,352 392,360 372,352" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="420" y="356" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace">判定</text>

    <rect x="492" y="344" width="40" height="16" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="540" y="356" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono', ui-monospace, Consolas, monospace">默认路径</text>
  </svg>
